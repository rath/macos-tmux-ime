# Load AFTER existing prefix settings. Requires ~/.local/bin/tmux-ime.
# if-shell waits for selection before entering the existing prefix table.
set -g prefix None
set -g prefix2 None
bind-key -T root C-a if-shell '"$HOME/.local/bin/tmux-ime" com.apple.keylayout.ABC >/dev/null 2>&1' { switch-client -T prefix } { display-message 'tmux-ime: ABC switch failed; check tmux-ime --list'; switch-client -T prefix }
bind-key -T copy-mode C-a if-shell '"$HOME/.local/bin/tmux-ime" com.apple.keylayout.ABC >/dev/null 2>&1' { switch-client -T prefix } { display-message 'tmux-ime: ABC switch failed; check tmux-ime --list'; switch-client -T prefix }
bind-key -T copy-mode-vi C-a if-shell '"$HOME/.local/bin/tmux-ime" com.apple.keylayout.ABC >/dev/null 2>&1' { switch-client -T prefix } { display-message 'tmux-ime: ABC switch failed; check tmux-ime --list'; switch-client -T prefix }
bind-key -T prefix C-a send-keys C-a
